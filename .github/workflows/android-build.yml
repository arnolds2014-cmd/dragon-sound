name: Expo Android CI - Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install ImageMagick to generate real PNGs
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate Real PNG Assets
        run: |
          # Eliminar los archivos corruptos/vacios previos
          rm -f assets/icon.png assets/adaptive-icon.png assets/splash.png
          mkdir -p assets
          
          # Crear imágenes PNG reales con fondo azul médico en la raíz correcta
          convert -size 512x512 xc:#0055ff assets/icon.png
          convert -size 1024x1024 xc:#0055ff assets/adaptive-icon.png
          convert -size 1280x1920 xc:#0055ff assets/splash.png

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run Expo prebuild for Android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: npx expo prebuild --platform android

      - name: Set executable permissions
        run: chmod +x app/gradlew

      - name: Build release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd app
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragon-sound-apk
          path: app/app/build/outputs/apk/release/*.apk
