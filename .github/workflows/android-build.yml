name: Android Native CI - Build True Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Native Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Set executable permissions for Gradle Wrapper
        run: |
          chmod +x gradlew || true
          chmod +x app/gradlew || true

      - name: Compile Native Core with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            cd app && ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Upload Core APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragon-sound-core-apk
          path: "**/build/outputs/apk/release/*.apk"
