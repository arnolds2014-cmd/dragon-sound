## Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# build.gradle files instead.
# When configured from the IDE, Gradle will create local.properties with the path to the Android SDK

# Gradle settings for this project, set values to override defaults
org.gradle.jvmargs=-Xmx2048m -Xms512m -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false -Djava.net.useSystemProxies=false -Dhttp.proxyHost= -Dhttps.proxyHost= -DsocksProxyHost= -Dhttp.proxyPort=0 -Dhttps.proxyPort=0 -DsocksProxyPort=0
org.gradle.parallel=true
org.gradle.caching=true

# Disable Gradle proxy negotiation because the environment injects local proxy settings.
systemProp.java.net.useSystemProxies=false
systemProp.http.proxyHost=
systemProp.http.proxyPort=0
systemProp.https.proxyHost=
systemProp.https.proxyPort=0
systemProp.socksProxyHost=
systemProp.socksProxyPort=0

# Android build configuration
android.useAndroidX=true
android.enableJetifier=true
android.compileSdkVersion=34
android.minSdkVersion=24
android.targetSdkVersion=34
android.suppressUnsupportedCompileSdk=34
